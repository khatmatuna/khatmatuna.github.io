    <script>
      // Reading pages (and the adhkar, which open with Ayat al-Kursi) are drawn in the Mushaf font, the biggest file of the site:
      // ask for it now, at low priority, so it comes right after the app's own files instead of after the page is drawn.
      // A WhatsApp group's page fetches it quietly, so the juz opens at once when tapped. Browsers without fetch priorities
      // skip this: there the font would compete with the app.
      (function () {
        try {
          if (!("fetchPriority" in HTMLLinkElement.prototype)) return;
          var h = location.hash,
            rel = /^#\/(wird|juz\/|mushaf\/\d|c\/[^/]+\/(read|juz\/)|adhkar|duas\/travel)/.test(h) || (h === "#/my" && localStorage.getItem("khatmatuna.me")) ? "preload" : /^#\/j\//.test(h) ? "prefetch" : "";
          if (rel) {
            var l = document.createElement("link");
            l.rel = rel;
            l.as = "font";
            l.type = "font/ttf";
            l.crossOrigin = "anonymous";
            l.fetchPriority = "low";
            l.href = "/preview/fonts/UthmanicHafs-v-3.0.ttf";
            document.head.appendChild(l);
          }
        } catch (e) {} // storage closed by the browser: the font simply starts later, as before
      })();
    </script>
